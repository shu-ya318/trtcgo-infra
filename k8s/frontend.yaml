apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: docker.io/library/lookgo-busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            [
              "sh",
              "-c",
              "until nc -z backend-service 8080; do echo waiting for backend-service; sleep 2; done",
            ]
      containers:
        - name: frontend
          image: docker.io/library/lookgo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            # nginx 層：值進到容器環境變數，由官方 entrypoint 的 envsubst 寫進 default.conf。
            # 改了這份 ConfigMap 必須 rollout restart，envsubst 只在容器啟動時跑一次。
            - configMapRef:
                name: frontend-config
          volumeMounts:
            # 瀏覽器層：ConfigMap 以「目錄」掛進 nginx 靜態根目錄底下的 cfg/。
            # ★ 不可改用 subPath，那會失去 ConfigMap 更新自動同步的能力。
            # ★ 掛在 /cfg 而非根目錄，否則會把整個 dist（index.html、assets/）蓋掉。
            - name: app-config
              mountPath: /usr/share/nginx/html/cfg
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-config
          configMap:
            name: frontend-app-config
            # 刻意不加 optional: true —— ConfigMap 不存在時應該讓 Pod 卡在 ContainerCreating、
            # 在部署階段就大聲失敗，而不是讓一個沒有設定的前端上線。
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
