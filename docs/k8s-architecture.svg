<svg viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- 最外框 -->
  <rect x="6" y="6" width="1388" height="868" rx="10" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- CLUSTER 框 -->
  <rect x="70" y="46" width="1140" height="788" rx="8" fill="none" stroke="#222" stroke-width="2"/>
  <text x="680" y="76" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="1">CLUSTER</text>

  <!-- CONTROL PLANE 框 -->
  <rect x="114" y="82" width="332" height="686" rx="8" fill="none" stroke="#222" stroke-width="2"/>
  <text x="280" y="110" text-anchor="middle" font-size="15">CONTROL PLANE</text>

  <!-- cloud-controller-manager -->
  <rect x="180" y="158" width="220" height="86" rx="10" fill="#2ea3de" stroke="#1580b8"/>
  <text x="290" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">cloud-controller-manager</text>

  <!-- etcd -->
  <rect x="140" y="330" width="82" height="82" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="181" y="378" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">etcd</text>

  <!-- kube-api-server -->
  <rect x="282" y="330" width="150" height="82" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="357" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">kube-api-server</text>

  <!-- scheduler -->
  <rect x="126" y="512" width="142" height="86" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="197" y="562" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">scheduler</text>
  <text x="197" y="622" text-anchor="middle" font-size="13">kube-scheduler</text>

  <!-- controller manager -->
  <rect x="284" y="512" width="148" height="86" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="358" y="556" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">controller</text>
  <text x="358" y="576" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">manager</text>
  <text x="358" y="622" text-anchor="middle" font-size="13">kube-controller-manager</text>

  <!-- Node 1 -->
  <rect x="560" y="340" width="250" height="392" rx="8" fill="none" stroke="#222" stroke-width="2"/>
  <text x="685" y="366" text-anchor="middle" font-size="16" font-family="Georgia, serif">Node 1</text>
  <rect x="578" y="412" width="102" height="68" rx="9" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="629" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">kubelet</text>
  <rect x="692" y="412" width="104" height="62" rx="9" fill="#2ea3de" stroke="#1580b8"/>
  <text x="744" y="449" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">kube-proxy</text>
  <!-- pods 區 Node1 -->
  <rect x="590" y="546" width="196" height="166" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="612" y="564" width="56" height="56" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="640" y="597" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">pod</text>
  <rect x="706" y="564" width="56" height="56" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="734" y="597" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">pod</text>
  <rect x="660" y="636" width="56" height="56" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="688" y="669" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">pod</text>
  <rect x="748" y="686" width="38" height="26" fill="#1a53e8"/>
  <text x="767" y="704" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">CRI</text>

  <!-- Node 2 -->
  <rect x="850" y="340" width="264" height="392" rx="8" fill="none" stroke="#222" stroke-width="2"/>
  <text x="982" y="366" text-anchor="middle" font-size="16" font-family="Georgia, serif">Node 2</text>
  <rect x="872" y="412" width="110" height="68" rx="9" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="927" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">kubelet</text>
  <rect x="1006" y="412" width="96" height="62" rx="9" fill="#2ea3de" stroke="#1580b8"/>
  <text x="1054" y="449" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">kube-proxy</text>
  <!-- pods 區 Node2 -->
  <rect x="880" y="546" width="210" height="166" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="950" y="596" width="60" height="60" rx="10" fill="#1a53e8" stroke="#0e3bb5"/>
  <text x="980" y="631" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">pod</text>
  <rect x="1052" y="686" width="38" height="26" fill="#1a53e8"/>
  <text x="1071" y="704" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">CRI</text>

  <!-- Cloud Provider API -->
  <g>
    <ellipse cx="1268" cy="200" rx="46" ry="34" fill="#2ea3de"/>
    <ellipse cx="1310" cy="178" rx="52" ry="38" fill="#2ea3de"/>
    <ellipse cx="1352" cy="202" rx="42" ry="32" fill="#2ea3de"/>
    <ellipse cx="1310" cy="214" rx="70" ry="34" fill="#2ea3de"/>
    <text x="1310" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">CLOUD PROVIDER API</text>
  </g>

  <!-- 連線 -->
  <!-- ccm <-> api-server 垂直雙向 -->
  <line x1="320" y1="244" x2="320" y2="330" stroke="#111" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- ccm --> cloud provider api（虛線） -->
  <line x1="400" y1="201" x2="1218" y2="201" stroke="#111" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <!-- api-server -> etcd -->
  <line x1="282" y1="371" x2="224" y2="371" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- scheduler -> api-server（折線） -->
  <path d="M197,512 L197,398 L280,398" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- controller manager -> api-server -->
  <line x1="358" y1="512" x2="358" y2="414" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Node1 kubelet -> api-server（實線） -->
  <path d="M629,412 L629,371 L436,371" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Node2 kubelet -> api-server（實線，繞上方進入頂邊） -->
  <path d="M927,412 L927,308 L352,308 L352,328" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- kube-proxy（兩節點）-> api-server（虛線） -->
  <path d="M1054,412 L1054,318 L744,318" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="5 5"/>
  <path d="M744,412 L744,318 L440,318 L440,345 L436,345" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <!-- Node1 kubelet / kube-proxy -> pods -->
  <path d="M629,480 L629,514 L688,514" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M744,474 L744,514 L688,514 L688,542" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Node2 kubelet / kube-proxy -> pods -->
  <path d="M927,480 L927,514 L985,514" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M1054,474 L1054,514 L985,514 L985,542" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
