services:
  database:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: lookGo-sql-server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql-server-data:/var/opt/mssql
      - ./sql-scripts:/sql-scripts
    entrypoint: /bin/bash /sql-scripts/init-db.sh
    networks:
      - lookGo-network
    restart: always
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: lookGo-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - lookGo-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ../lookGo-backend
      args:
        - SETTINGS_FILE=${MVN_SETTINGS:-settings-public.xml}
    image: lookgo-backend:latest
    container_name: lookGo-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=database
      - REDIS_HOST=redis
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - RAIL_PROXY_HOST=${RAIL_PROXY_HOST}
      - RAIL_PROXY_PROT=${RAIL_PROXY_PROT}
      - TDX_CLIENT_ID=${TDX_CLIENT_ID}
      - TDX_CLIENT_SECRET=${TDX_CLIENT_SECRET}
      # - MAIL_USERNAME=${MAIL_USERNAME}
      # - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lookGo-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../lookGo-frontend
      args:
        - NPM_RC_FILE=${NPM_RC_FILE:-.npmrc-public}
    image: lookgo-frontend:latest
    container_name: lookGo-frontend
    ports:
      - "8081:80"
    environment:
      # 127.0.0.11 是 Docker 在 user-defined network（lookGo-network）中提供的內建 DNS
      - DNS_RESOLVER=${DNS_RESOLVER:-127.0.0.11}
      - BACKEND_URL=${BACKEND_URL}
    volumes:
      # 掛到官方 templates 目錄，交由 /docker-entrypoint.d/20-envsubst-on-templates.sh 處理，
      # 與 K8s 走完全相同的注入鏈路（不可覆寫 command，否則 $1 不是 nginx，整批腳本會被跳過）
      - ../lookGo-frontend/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # 對應 K8s 的 frontend-app-config ConfigMap volume
      - ./local-cfg:/usr/share/nginx/html/cfg:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lookGo-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf" ,"http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  lookGo-network:

volumes:
  sql-server-data:
  redis-data:
